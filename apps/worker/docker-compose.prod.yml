services:
  worker:
    image: ${WORKER_IMAGE:?defina WORKER_IMAGE}:${IMAGE_TAG:?defina IMAGE_TAG}
    restart: unless-stopped
    env_file: ${ENV_FILE:?defina ENV_FILE}
    environment:
      NODE_ENV: production
      APP_VERSION: ${IMAGE_TAG:?defina IMAGE_TAG}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 40s   # > timeout do boss.stop (30 s)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # Sem "ports": o worker só faz conexões de saída.

name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions: { contents: read }

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Supabase local
        run: pnpm exec supabase start
      - run: pnpm db:migrate
      - run: pnpm test:db
      - run: pnpm build
      - name: E2E
        run: |
          # Nomes verificados com `supabase status -o env`: DB_URL, PUBLISHABLE_KEY, SERVICE_ROLE_KEY.
          # Com a Data API desligada ([api] enabled = false) o status não imprime API_URL; o gateway
          # (Auth/Storage) continua em 127.0.0.1:54321.
          eval "$(pnpm exec supabase status -o env | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export DATABASE_URL="$DB_URL" PHONE_ENC_KEY="$(openssl rand -base64 32)" WA_ID_PEPPER="$(openssl rand -base64 32)"
          export WHATSAPP_APP_SECRET=ci WHATSAPP_VERIFY_TOKEN=ci WHATSAPP_PHONE_NUMBER_ID=1
          psql "$DB_URL" -c "insert into restaurants (nome) values ('CI')"
          pnpm --filter @atd/web exec playwright install --with-deps chromium
          pnpm --filter @atd/web e2e
      - run: pnpm audit --prod --audit-level high

  evals-extracao:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: chave
        name: Chave de evals configurada?
        run: echo "tem=${{ secrets.OPENROUTER_API_KEY_EVALS != '' && '1' || '0' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: mudou
        name: Prompt ou triagem mudaram?
        env: { BASE_REF: "${{ github.base_ref }}" }
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^packages/ai/(src/prompts/|src/triage\.ts|evals/)'; then
            echo "sim=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.mudou.outputs.sim == '1' && steps.chave.outputs.tem == '1'
      - uses: actions/setup-node@v5
        if: steps.mudou.outputs.sim == '1' && steps.chave.outputs.tem == '1'
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.mudou.outputs.sim == '1' && steps.chave.outputs.tem == '1'
        run: pnpm install --frozen-lockfile
      - name: Evals de extração S1 (custo real, teto US$ 0,30)
        if: steps.mudou.outputs.sim == '1' && steps.chave.outputs.tem == '1'
        working-directory: packages/ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_EVALS }}
          AI_TRIAGE_MODELS: ${{ vars.AI_TRIAGE_MODELS }}
        run: node evals/s1/extracao.ts --teto 0.30
      - name: Evals de extração S2 (custo real, teto US$ 0,30)
        if: steps.mudou.outputs.sim == '1' && steps.chave.outputs.tem == '1'
        working-directory: packages/ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_EVALS }}
          AI_TRIAGE_MODELS: ${{ vars.AI_TRIAGE_MODELS }}
        run: node evals/s2/extracao.ts --teto 0.30
      - name: Evals de extração S3 (custo real, teto US$ 0,30)
        if: steps.mudou.outputs.sim == '1' && steps.chave.outputs.tem == '1'
        working-directory: packages/ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_EVALS }}
          AI_TRIAGE_MODELS: ${{ vars.AI_TRIAGE_MODELS }}
        run: node evals/s3/extracao.ts --teto 0.30
